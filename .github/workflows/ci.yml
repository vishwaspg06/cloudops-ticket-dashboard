name: CloudOps CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend syntax
        working-directory: backend
        run: node --check server.js

      - name: Start backend and test health
        working-directory: backend
        run: |
          node server.js &
          sleep 5
          curl --fail http://localhost:5000/

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t cloudops-backend:ci ./backend

      - name: Run backend container and test health
        run: |
          docker run -d --name cloudops-backend -p 5001:5000 cloudops-backend:ci
          sleep 5
          curl --fail http://localhost:5001/health